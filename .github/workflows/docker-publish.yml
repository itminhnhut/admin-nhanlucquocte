name: 🐳 Build & Push Docker Image

on:
  push:
    branches:
      - main        # deploy production khi push vào main
      - develop     # deploy staging khi push vào develop
    tags:
      - "v*.*.*"    # deploy khi tag version (v1.0.0, v2.1.3, ...)
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]  # chỉ build (không push) để validate

# ── Chỉ chạy 1 workflow cùng lúc cho mỗi branch/tag ─────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io                                   # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}                # devnhut/admin-edu-viet-uc

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build và Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write          # cần để push lên ghcr.io
      id-token: write          # cần cho OIDC (optional)

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup QEMU (multi-platform build: amd64 + arm64) ────────────────
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Setup Docker Buildx ──────────────────────────────────────────────
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      # ── 4. Login vào GitHub Container Registry ──────────────────────────────
      - name: 🔑 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Tự động generate tags và labels ─────────────────────────────────
      - name: 🏷️  Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag :latest cho branch main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag tên branch
            type=ref,event=branch
            # Tag semantic version từ git tag (v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag commit SHA ngắn
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Edu Viet UC - Admin Portal
            org.opencontainers.image.description=Vietnam Australia Vocational College Admin Dashboard
            org.opencontainers.image.vendor=devnhut

      # ── 6. Build & Push ─────────────────────────────────────────────────────
      # LƯU Ý: KHÔNG truyền VITE_* vào đây!
      # Giá trị thực sẽ được inject lúc RUNTIME bởi docker/env.sh
      - name: 🚀 Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                 # dùng GitHub Actions cache
          cache-to: type=gha,mode=max
          provenance: false                    # tắt để giảm size manifest

      # ── 7. Log image digest ─────────────────────────────────────────────────
      - name: 📋 Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Digest: ${{ steps.build.outputs.digest }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "🚀 EasyPanel: Dùng image dưới đây:"
          echo "   ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
